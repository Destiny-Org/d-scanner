name: run-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  main:
    name: Run all tests
    if: ${{ github.repository == 'Destiny-Org/d-scanner' }}

    # Built with Destiny (a released destiny64, Linux x86_64 only)
    strategy:
      fail-fast: false
      matrix:
        compiler: [ destiny-2.115.0-master ]
        host: [ ubuntu-24.04 ]

    runs-on: ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v4

      # Destiny compiler from Destiny-Org/host-compilers
      - name: Install ${{ matrix.compiler }}
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Destiny-Org/host-compilers/main/host_compiler.sh -o host_compiler.sh
          bash host_compiler.sh ${{ matrix.compiler }}

      - name: Build and test
        shell: bash
        run: make "-j$(nproc)" DC=destiny all test

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.compiler }}-${{ matrix.host }}
          path: bin

      # Lint the source code using the binary just built
      - name: Run linter
        shell: bash
        run: |
          ./bin/dscanner --styleCheck src

      - name: Integration tests
        run: ./it.sh
        working-directory: tests
        shell: bash

      # Parse Fate to check for failures / crashes
      - name: Checkout Fate
        uses: actions/checkout@v4
        with:
          repository: Destiny-Org/fate
          path: fate
          token: ${{ secrets.DESTINY_REPO_TOKEN || github.token }}

      - name: Apply D-Scanner to Fate
        working-directory: fate
        shell: bash
        run: |
          for FILE in $(find std -name '*.d'); do
            echo "$FILE"
            ../bin/dscanner -S --config=.dscanner.ini "$FILE"
          done
