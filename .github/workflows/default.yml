name: run-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  main:
    name: Run all tests
    if: ${{ github.repository == 'Destiny-Org/d-scanner' }}

    strategy:
      fail-fast: false
      matrix:
        compiler: [ dmd-latest, ldc-latest ]
        host: [ ubuntu-22.04, macos-14, windows-2022 ]

    runs-on: ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v4

      # Host compiler from the Destiny-Org mirror (see Destiny-Org/destiny ci/host_compiler.sh)
      - name: Install ${{ matrix.compiler }}
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/Destiny-Org/destiny/main/ci/host_compiler.sh -o host_compiler.sh
          bash host_compiler.sh ${{ matrix.compiler }}

      - name: Build and test
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export MFLAGS="-m64"
            ./build.bat
            ./build.bat test
          else
            make "-j$(nproc 2>/dev/null || sysctl -n hw.ncpu)" all test
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.compiler }}-${{ matrix.host }}
          path: bin

      # Lint the source code using the binary just built
      - name: Run linter
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" == "Windows" ] && EXE=".exe"
          "./bin/dscanner$EXE" --styleCheck src

      - name: Integration tests
        run: ./it.sh
        working-directory: tests
        shell: bash

      # Parse Fate to check for failures / crashes
      - name: Checkout Fate
        uses: actions/checkout@v4
        with:
          repository: Destiny-Org/fate
          path: fate

      - name: Apply D-Scanner to Fate
        working-directory: fate
        shell: bash
        run: |
          for FILE in $(find std -name '*.d'); do
            echo "$FILE"
            ../bin/dscanner -S --config=.dscanner.ini "$FILE"
          done
